name: Build macOS (AU Universal)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner macOS (macos-15-intel, macos-15, macos-14)'
        default: 'macos-15-intel'

permissions: { contents: write }
jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (Apple Silicon + Intel)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j "$(sysctl -n hw.ncpu)"

      - name: Sign (ad-hoc) and validate
        run: |
          COMP="build/GLoveKitRipper_artefacts/Release/AU/G.LOVE Kit Ripper.component"
          codesign --force --deep -s - "$COMP"
          lipo -info "$COMP/Contents/MacOS/"*
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$COMP" ~/Library/Audio/Plug-Ins/Components/ || true
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Gkrp Glov | tail -n 5 || true

      - name: Package
        run: |
          mkdir -p dist/GLoveKitRipper
          cp -R "build/GLoveKitRipper_artefacts/Release/AU/G.LOVE Kit Ripper.component" dist/GLoveKitRipper/
          cp tester/INSTALLA-TESTER.command tester/LEGGIMI-TESTER.txt dist/GLoveKitRipper/
          chmod +x dist/GLoveKitRipper/INSTALLA-TESTER.command
          cd dist && ditto -c -k --keepParent GLoveKitRipper "GLoveKitRipper-${GITHUB_SHA::7}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: GLoveKitRipper-macOS-universal
          path: dist/*.zip

      - name: Versione dal CMakeLists
        id: ver
        run: echo "v=v$(sed -n 's/^project(GLoveKitRipper VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      # Release: sui tag v*, oppure su main quando il messaggio del commit contiene [release]
      # (il tag vX.Y.Z viene creato da GitHub con la versione scritta nel CMakeLists)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: G.LOVE Kit Ripper ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.v }}
          body: |
            Plugin AU per Logic Pro (Apple Silicon + Intel).
            Scarica lo zip, aprilo e fai doppio click su INSTALLA-TESTER.command.
            Poi in Logic: traccia Software Instrument > AU Instruments > G.LOVE > G.LOVE Kit Ripper.
          files: dist/*.zip
